[project]
name = "sentinel"
version = "0.1.0"
description = "HomeView Sentinel: alerts on the iPhone when a vehicle stays stopped in front of the house"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools>=9.0",
    "jsonschema>=4.26.0",
    "numpy>=2,<2.4",
    "opencv-python>=5.0.0.93",
    "paho-mqtt>=2.1.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "supervision>=0.31.0",
    "trackers>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
export = [
    "torch>=2.5,<2.7.1",
    "torchvision<0.22.1",
    "ultralytics>=8.4.182",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Long lines are left to the formatter.
ignore = ["E501"]
